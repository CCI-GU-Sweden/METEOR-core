# .github/workflows/CI.yaml
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format (check)
        run: ruff format --check .

  build:
    name: Build package (sdist + wheel)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build
        run: python -m build
      - name: Check dist contents
        run: ls -lah dist

  test:
    name: Tests (pytest - fast)
    runs-on: ubuntu-latest
    needs: [lint, build]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install .[testing]
      - name: Run fast tests (exclude integration)
        run: pytest -m "not integration" --strict-markers

  test-integration:
    name: Tests (pytest - integration)
    runs-on: ubuntu-latest
    needs: [lint, build]
    # run only on main/master pushes or manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package with test extras (+ optional IO deps)
        run: |
          python -m pip install --upgrade pip
          pip install .[testing,io]
      - name: Run integration tests
        run: pytest -m integration --strict-markers